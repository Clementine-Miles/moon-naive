[package]
name = "moon-naive-client"
description = "First-party Moon-naive client: local SOCKS5/HTTP CONNECT over mona (Rupin) tunnels carried by the Chromium native engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "moon-naive-client"
path = "src/main.rs"
test = true
bench = false

[lib]
test = true
doctest = false
bench = false

[dependencies]
moon-naive-core.workspace = true
serde.workspace = true
toml.workspace = true
base64.workspace = true
tokio.workspace = true
moon-naive-engine.workspace = true
getrandom = "0.3.4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { workspace = true, features = ["net"] }

[lints]
workspace = true
