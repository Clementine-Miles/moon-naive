[package]
name = "moon-naive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
test = true
bench = false
name = "moon-naive"
path = "src/main.rs"

[dependencies]
nix = { workspace = true, features = ["net"] }
moon-naive-core.workspace = true
pingora-core = { git = "https://github.com/cloudflare/pingora.git", rev = "f86ffda5d3ae5c3baf5125682138b33b26c01b08", default-features = false, features = ["boringssl"] }
pingora-http = { git = "https://github.com/cloudflare/pingora.git", rev = "f86ffda5d3ae5c3baf5125682138b33b26c01b08" }
pingora-proxy = { git = "https://github.com/cloudflare/pingora.git", rev = "f86ffda5d3ae5c3baf5125682138b33b26c01b08", default-features = false, features = ["boringssl"] }
h2 = "0.4"
quiche = { git = "https://github.com/cloudflare/quiche.git", rev = "7ccccc7b7f4bd4ec6bc70219fdbe491024f5cb0b", default-features = false, features = ["boringssl-boring-crate"] }
instant-acme = { git = "https://github.com/djc/instant-acme.git", rev = "1909bed8eee54d7289d64b3e9ff573ac5b272676", default-features = false, features = ["time", "x509-parser"] }
boring = "=5.5.0"
tokio-boring = "=5.5.0"
tokio.workspace = true
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http.workspace = true
http-body-util = "0.1"
bytes = "1"
memchr = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toml = "1.2.1"
base64 = "0.23.1"
rustls-pki-types = "1"
time = "=0.3.55"
httpdate = "1"
async-trait = "0.1"
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
x509-parser = { version = "0.18", default-features = false }
socket2 = { version = "=0.6.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["time", "fs"] }

[lints]
workspace = true

[workspace]
resolver = "2"
exclude = ["vendor/instant-acme", "vendor/pingora", "vendor/pingora/*"]
members = ["core", "client", "engine/bridge", "tools/xtask"]
default-members = [".", "client"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
moon-naive-core = { path = "core" }
moon-naive-client = { path = "client" }
moon-naive-engine = { path = "engine/bridge" }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
base64 = "0.23.1"
sha2 = "0.11.1"
hmac = "0.13.0"
http = "1"
serde_json = "1"
nix = { version = "0.31.3", default-features = false }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "time", "signal", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
strip = true

[patch."https://github.com/cloudflare/pingora.git"]
pingora-boringssl = { path = "vendor/pingora/pingora-boringssl" }
pingora-cache = { path = "vendor/pingora/pingora-cache" }
pingora-core = { path = "vendor/pingora/pingora-core" }
pingora-error = { path = "vendor/pingora/pingora-error" }
pingora-header-serde = { path = "vendor/pingora/pingora-header-serde" }
pingora-http = { path = "vendor/pingora/pingora-http" }
pingora-lru = { path = "vendor/pingora/pingora-lru" }
pingora-pool = { path = "vendor/pingora/pingora-pool" }
pingora-proxy = { path = "vendor/pingora/pingora-proxy" }
pingora-runtime = { path = "vendor/pingora/pingora-runtime" }
pingora-timeout = { path = "vendor/pingora/pingora-timeout" }

[patch."https://github.com/djc/instant-acme.git"]
instant-acme = { path = "vendor/instant-acme" }


[lib]
test = true
doctest = true
bench = false

[dev-dependencies]
moon-naive-client.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
