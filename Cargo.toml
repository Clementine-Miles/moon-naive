[package]
name = "moon-naive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[[bin]]
test = true
bench = false
name = "moon-naive"
path = "src/main.rs"

[dependencies]
moon-naive-core.workspace = true
pingora-core = { git = "https://github.com/cloudflare/pingora.git", rev = "4487f7b2ab50f159e4a2cf4f6a6b813f61bb6e19", default-features = false, features = ["boringssl"] }
pingora-http = { git = "https://github.com/cloudflare/pingora.git", rev = "4487f7b2ab50f159e4a2cf4f6a6b813f61bb6e19" }
pingora-proxy = { git = "https://github.com/cloudflare/pingora.git", rev = "4487f7b2ab50f159e4a2cf4f6a6b813f61bb6e19", default-features = false, features = ["boringssl"] }
h2 = "0.4"
quiche = { git = "https://github.com/cloudflare/quiche.git", rev = "925b225825e2188f8e58e359114150500557bf61", default-features = false, features = ["boringssl-boring-crate"] }
instant-acme = { git = "https://github.com/djc/instant-acme.git", rev = "4a9b80fdc22f23ab39b78dfd20ff5d4c92938e52", default-features = false, features = ["time", "x509-parser"] }
boring = "=5.2.0"
boring-sys = "=5.2.0"
tokio-boring = "=5.0.0"
tokio.workspace = true
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
memchr = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
rustls-pki-types = "1"
time = "=0.3.47"
httpdate = "1"
async-trait = "0.1"
hickory-proto = { version = "=0.26.1", default-features = false, features = ["std"] }
x509-parser = { version = "0.18", default-features = false }
socket2 = { version = "=0.6.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["time", "fs"] }

[lints]
workspace = true

[workspace]
resolver = "2"
exclude = ["vendor/instant-acme", "vendor/pingora", "vendor/pingora/*"]
members = ["core", "tools/xtask"]
default-members = ["."]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
moon-naive-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
base64 = "0.22"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "time", "signal", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
strip = true

[patch."https://github.com/cloudflare/pingora.git"]
pingora-boringssl = { path = "vendor/pingora/pingora-boringssl" }
pingora-cache = { path = "vendor/pingora/pingora-cache" }
pingora-core = { path = "vendor/pingora/pingora-core" }
pingora-error = { path = "vendor/pingora/pingora-error" }
pingora-header-serde = { path = "vendor/pingora/pingora-header-serde" }
pingora-http = { path = "vendor/pingora/pingora-http" }
pingora-lru = { path = "vendor/pingora/pingora-lru" }
pingora-pool = { path = "vendor/pingora/pingora-pool" }
pingora-proxy = { path = "vendor/pingora/pingora-proxy" }
pingora-runtime = { path = "vendor/pingora/pingora-runtime" }
pingora-timeout = { path = "vendor/pingora/pingora-timeout" }

[patch."https://github.com/djc/instant-acme.git"]
instant-acme = { path = "vendor/instant-acme" }


[lib]
test = true
doctest = true
bench = false

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
