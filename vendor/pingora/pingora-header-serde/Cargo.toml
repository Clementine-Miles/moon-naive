[package]
name = "pingora-header-serde"
version = "0.9.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/cloudflare/pingora"
categories = ["compression"]
keywords = ["http", "compression", "pingora"]
exclude = ["samples/*"]
description = """
HTTP header (de)serialization and compression for Pingora.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
test = false
doctest = false
bench = false
name = "pingora_header_serde"
path = "src/lib.rs"

[features]
default = ["zstd"]
zstd = ["dep:zstd", "dep:zstd-safe"]

[dependencies]
zstd = { version = "0.13.1", optional = true }
zstd-safe = { version = "7.1.0", features = ["std"], optional = true }
http = { workspace = true }
bytes = { workspace = true }
httparse = { workspace = true }
pingora-error = { version = "0.9.0", path = "../pingora-error" }
pingora-http = { version = "0.9.0", path = "../pingora-http" }
thread_local = "1.0"
