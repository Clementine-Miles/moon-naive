[package]
name = "pingora-cache"
version = "0.9.0"
authors = ["Yuchen Wu <yuchen@cloudflare.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/cloudflare/pingora"
categories = ["asynchronous", "network-programming"]
keywords = ["async", "http", "cache"]
description = """
HTTP caching APIs for Pingora proxy.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
test = false
doctest = false
bench = false
name = "pingora_cache"
path = "src/lib.rs"

[dependencies]
pingora-core = { version = "0.9.0", path = "../pingora-core", default-features = false }
pingora-error = { version = "0.9.0", path = "../pingora-error" }
pingora-header-serde = { version = "0.9.0", path = "../pingora-header-serde", default-features = false }
pingora-http = { version = "0.9.0", path = "../pingora-http" }
pingora-lru = { version = "0.9.0", path = "../pingora-lru" }
pingora-timeout = { version = "0.9.0", path = "../pingora-timeout" }
bstr = { workspace = true }
http = { workspace = true }
indexmap = "1"
once_cell = { workspace = true }
regex = "1"
blake2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3.0"
bytes = { workspace = true }
httpdate = "1.0.2"
log = { workspace = true }
async-trait = { workspace = true }
parking_lot = "0.12"
cf-rustracing = { version = "1.0", optional = true }
cf-rustracing-jaeger = { version = "1.0", optional = true }
rmp = "0.8.14"
tokio = { workspace = true }
lru = { workspace = true }
ahash = { workspace = true }
hex = "0.4"
httparse = { workspace = true }
strum = { version = "0.26", features = ["derive"] }
rand = "0.8"
arrayvec = "0.7"

[features]
default = ["header-compression"]
header-compression = ["pingora-header-serde/zstd"]
openssl = ["pingora-core/openssl"]
boringssl = ["pingora-core/boringssl"]
rustls = ["pingora-core/rustls"]
s2n = ["pingora-core/s2n"]
trace = ["dep:cf-rustracing", "dep:cf-rustracing-jaeger"]
