# Moon-naive single-endpoint server configuration (schema 2; schema 1 files
# still load). Two-endpoint example: config.dual.example.toml. Destination ACL
# example: acl.example.toml. Full reference: docs/usage.md.
#
#   moon-naive config init /etc/moon-naive/config.toml   # private 0600, never overwrites
#   moon-naive check /etc/moon-naive/config.toml          # offline preflight
#   moon-naive serve /etc/moon-naive/config.toml
#
# `serve` obtains the first certificate over DNS-01, validates it, starts the
# listeners, and then renews and hot-reloads automatically (no certbot/cron).
# Replace every placeholder. Never commit a configuration containing secrets.

# Proxy/website host name only: no scheme, port or path. Point A (and AAAA
# only if IPv6 is really reachable) at the server. Never make the website
# origin point back at this name.
domain = "proxy.example.dev"
# schema_version defaults to 2; state_dir defaults to /var/lib/moon-naive.
# state_dir holds the ACME account, certificates and renewal journal. It must
# persist across restarts and is not a cache.
# state_dir = "/var/lib/moon-naive"

[[proxy.users]]
username = "REPLACE_WITH_USERNAME"
# Independent random password, at least 16 bytes (32+ characters recommended).
# Repeat [[proxy.users]] for more users.
password = "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"

[website]
# Fixed reverse proxy for the whole site: e.g. http://127.0.0.1:8080 or a real
# HTTPS origin. The origin Host is set automatically; HTTPS origins are
# verified with SNI and certificate checks. Only scheme, host and optional
# port are accepted (no userinfo, path or query). Redirects, cookies and
# absolute links are not rewritten.
origin = "http://127.0.0.1:8080"

[acme]
issuer = "google"                    # Google Trust Services; letsencrypt is the default if omitted.
environment = "production"           # Publicly trusted; use staging (with staging EAB) for tests.
contact = "operator@example.dev"      # Contact email, not a Google API key.
dns_zone = "example.dev"              # The Porkbun-hosted zone, not proxy.example.dev.
# Set to true only after reading and accepting the CA's terms. While false,
# only offline structural checks run. Current GTS terms: https://pki.goog/GTS-SA.pdf
accept_terms = false
# Defaults: enabled = true, challenge = "dns-01", dns_provider = "porkbun".
# DNS-01 needs no open port 80. Only challenge TXT records are managed, never
# A/AAAA, NS or CAA. The zone must use Porkbun DNS with API access enabled.
# Existing CAA records must allow pki.goog. Browsers do not trust staging
# certificates, and .dev HSTS does not relax that.

[acme.dns_credentials]
# Both keys from https://porkbun.com/account/api. They need NS read and TXT
# create/read/delete for the zone.
apikey = "pk1_REPLACE_ME"
secretapikey = "sk1_REPLACE_ME"

[acme.eab]
# GTS External Account Binding: required only to register the ACME account the
# first time. Separate from the Porkbun keys; not a certificate or API key.
# On any machine with a configured Google Cloud project:
#   gcloud services enable publicca.googleapis.com
#   gcloud publicca external-account-keys create --format=json
# Map keyId -> key_id and b64MacKey -> b64_mac_key, keeping the base64url text.
# Use the EAB within 7 days; it registers one account. After the account is
# stored in state_dir, this table may be removed: restarts and renewals reuse
# the persisted account. Never mix staging and production EAB.
key_id = "REPLACE_WITH_GTS_EAB_KEY_ID"
# Parseable public placeholder only; replace with the real b64MacKey.
b64_mac_key = "dGVzdC10ZXN0LXRlc3QtdGVzdA"

# ── Optional settings. Values shown are defaults or examples; uncomment the
# table header and the fields you need. Do not create duplicate TOML tables.
#
# [listener]
# tcp = "0.0.0.0:443"          # TLS over TCP (IPv4 by default; use [::]:443 for IPv6).
# udp = "0.0.0.0:443"          # QUIC/H3. Open both TCP and UDP 443 in the firewall.
# h1 = true                   # Website and no-ALPN fallback only; never a proxy entry.
# h2 = true
# h3 = true
# http_redirect = "0.0.0.0:80" # Off by default; optional HTTP 308 redirect (needs TCP 80).
#
# Use [[listeners]] instead of [listener] for explicit flow control or several
# endpoints; never configure both. Each entry has a unique name and its own
# protocols, limits and windows.
# [[listeners]]
# name = "main"
# tcp = "0.0.0.0:443"
# udp = "0.0.0.0:443"
# h1 = true
# h2 = true
# h3 = true
# handshake_timeout_secs = 10
# [listeners.flow]
# h2_stream_window = 65536
# h2_connection_window = 524288
# h3_stream_window = 4096
# h3_connection_window = 524288
# [limits] stays the process-wide ceiling; [listeners.limits] sets endpoint budgets.
# listeners.bandwidth_bytes_per_sec is a byte-rate limit, not a flow-control window.
#
# If the kernel supports BBR, uncomment these. `moon-naive check-transport`
# reads back the effective TCP algorithm and windows.
# [transport]
# tcp_congestion = "bbr"     # Applied to listeners and outbound sockets; startup fails if missing. Default: system.
# quic_congestion = "bbr2"   # quiche BBRv2 with pacing. Default: cubic.
# Host sysctls and qdiscs are never modified. TCP Fast Open is never used.
#
# [limits]
# max_streams = 100
# max_connections = 128
# max_pending_requests = 100
# max_tunnels_per_user = 100
# max_early_data_bytes = 65536         # Bounded buffering during auth/dial; not TLS 0-RTT.
# max_buffer_bytes_per_stream = 262144
# The initial H2 stream window is the smaller of the two values above; H3 is
# also bounded by the connection window and control-stream reserve. Raise
# max_early_data_bytes only after measuring a window bottleneck.
# max_total_receive_bytes = 67108864   # Receive credit (512 KiB per connection by default), not an RSS cap.
# max_total_buffer_bytes = 67108864    # Application DATA byte pool, separate from receive credit.
# connect_timeout_secs = 15
# idle_timeout_secs = 600     # Longest period without application progress, not a lifetime.
# graceful_timeout_secs = 300          # Keep the service manager stop timeout above this.
#
# [traffic]
# initial_records = 16        # 8 or 16; still subject to client negotiation.
# sparse_padding = true      # Never generates idle cover traffic; see docs/protocol.md.
#
# Website settings below belong in the [website] table above:
# compression_level = 5       # 0..6; 0 disables dynamic gzip; no-transform is honored.
# max_request_body_bytes = 67108864
# connect_timeout_secs = 5
# read_timeout_secs = 30      # Raise for quiet SSE streams; let the origin send heartbeats.
# write_timeout_secs = 30
# upstream_idle_secs = 60
# dns_ttl_secs = 60
#
# Renewal settings below belong in the [acme] table above:
# renew_before_secs = 2592000 # 30-day window; ACME Renewal Information is honored.
# retry_initial_secs = 60
# retry_max_secs = 21600
# request_timeout_secs = 30
# operation_timeout_secs = 900
# poll_interval_secs = 5
#
# Several origins or paths: remove website.origin above and use these tables.
# [[website.upstreams]]
# name = "app"
# origins = ["https://origin.example.net"]
# host_header = "origin.example.net" # Default keeps the visitor's Host.
# http2 = true
# # tls_server_name = "origin.example.net" # Defaults to each origin's host.
# # ca_file = "/etc/moon-naive/origin-ca.pem" # Private CA only; always verified.
# [[website.routes]]
# path_prefix = "/"
# upstream = "app"
# strip_prefix = false
#
# Optional outbound next hop. Omit for direct egress. A configured next hop
# never falls back to direct egress on failure. Its CA/TLS context loads at
# startup; restart after changing trust anchors.
# [proxy.upstream]
# kind = "https"              # http, https or socks5 (only https adds TLS).
# address = "upstream.example.net:443"
# username = "upstream-user"  # Omit together with password for no authentication.
# password = "upstream-password"
#
# The main file must be mode 0600; the service user owns it and state_dir (0700).
# Clients: use moon-naive-client (client.example.toml). Upstream NaiveProxy
# clients are not compatible with the mona Rupin profile.
#
# Destination ACL: set acl_file = "/etc/moon-naive/acl.toml" in the [proxy]
# table. The complete private 0600 file must load before startup. Without it,
# mandatory public-IP and self-connection checks still apply. The ACL can only
# restrict authenticated proxy destinations further; it cannot open private
# networks and does not govern configured website origins.

# Ordinary authenticated HTTP(S) forwarding; independent of [website] and CONNECT.
# Bodies stream with backpressure; this is a cumulative unique-byte limit.
[proxy.forward]
max_request_body_bytes = 1073741824 # 1 GiB; older versions inherited website's 64 MiB
connect_timeout_secs = 10
read_timeout_secs = 120
write_timeout_secs = 120
upstream_idle_secs = 30
max_requests_per_user = 32 # admission through response completion, including DNS
