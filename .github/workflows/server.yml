name: mona server
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: python3 tools/vectors/generate.py --check
      - run: cargo test --locked -p moon-naive-core
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config perl
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=4
      - run: cargo build --locked --release -p moon-naive
      - run: cargo xtask audit-native
      - run: cargo xtask lab --only oracles --run "${RUNNER_TEMP}/mona-oracles"
      - run: cargo test --manifest-path vendor/instant-acme/Cargo.toml --locked --no-default-features --features time,x509-parser --lib
        env:
          CARGO_TARGET_DIR: /tmp/mona-acme-validation
