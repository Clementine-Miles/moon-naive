name: Moon-naive
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      differential:
        description: Run the pinned independent Caddy H1/H2/H3 comparison
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: cargo xtask vectors --check
      - run: cargo xtask audit-tfo
      - run: cargo test --locked -p moon-naive-core
  server-and-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config perl
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo xtask audit-native
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=4
      - run: cargo build --locked --release -p moon-naive -p moon-naive-client
      - run: cargo xtask lab --only oracles --run "${RUNNER_TEMP}/mona-oracles"
      - run: cargo test --manifest-path vendor/instant-acme/Cargo.toml --locked --no-default-features --features time,x509-parser --lib
        env:
          CARGO_TARGET_DIR: /tmp/mona-acme-validation
  engine:
    # Chromium native engine: reproducible build from the pinned NaiveProxy
    # tree + engine/chromium.patch + engine/src overlay, ABI/link check, the
    # client<->server interop suite, and the client release artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config perl ninja-build python3 xz-utils
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - id: engine-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/engine
          key: moon-engine-${{ runner.os }}-${{ hashFiles('engine/UPSTREAM_REVISION', 'engine/chromium.patch', 'engine/args.gn', 'engine/src/**', 'tools/xtask/src/engine.rs') }}
      - name: Build the Chromium native engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          cargo xtask engine fetch "$RUNNER_TEMP/chromium"
          cargo xtask engine toolchain "$RUNNER_TEMP/chromium"
          cargo xtask engine check "$RUNNER_TEMP/chromium"
          cargo xtask engine build "$RUNNER_TEMP/chromium"
          mkdir -p "$RUNNER_TEMP/engine"
          cp "$RUNNER_TEMP/chromium/src/out/engine/libmoon_engine.so" "$RUNNER_TEMP/engine/"
          rm -rf "$RUNNER_TEMP/chromium"
      - run: cargo xtask check-engine "$RUNNER_TEMP/engine/libmoon_engine.so"
      - run: cargo xtask interop --engine "$RUNNER_TEMP/engine/libmoon_engine.so"
      - run: cargo build --locked --release -p moon-naive-client
      - run: cargo xtask dist-client target/release/moon-naive-client "$RUNNER_TEMP/engine/libmoon_engine.so" "$RUNNER_TEMP/client-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: moon-naive-client-x86_64-unknown-linux-gnu
          path: |
            ${{ runner.temp }}/client-dist/*.tar.gz
            ${{ runner.temp }}/client-dist/*.tar.gz.sha256
          retention-days: 14
  differential:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.differential }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config perl
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask differential-fetch "${RUNNER_TEMP}/caddy-reference"
      - run: cargo xtask differential --caddy "${RUNNER_TEMP}/caddy-reference/caddy" --run "${RUNNER_TEMP}/https-differential"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: https-differential-report
          path: |
            ${{ runner.temp }}/https-differential/result.json
            ${{ runner.temp }}/https-differential/summary.md
          retention-days: 7
