# Fixed observation rules. No allow/block/drop action: all selected analyzers
# continue until their own limit/completion. Logs may repeat after property updates.
- name: http-visible
  log: true
  expr: http != nil
- name: tls-visible
  log: true
  expr: tls != nil
- name: quic-visible
  log: true
  expr: quic != nil
- name: fet-result
  log: true
  expr: fet != nil
- name: fully-encrypted-positive
  log: true
  expr: fet != nil && fet.yes == true
- name: trojan-result
  log: true
  expr: trojan != nil
- name: trojan-positive
  log: true
  expr: trojan != nil && trojan.yes == true
- name: tls-sni-positive-control
  log: true
  expr: tls != nil && tls.req != nil && tls.req.sni == "blocked.test"
- name: http-host-positive-control
  log: true
  expr: http != nil && http.req != nil && http.req.headers != nil && http.req.headers.host == "blocked.test"
- name: other-protocol-visible
  log: true
  expr: socks != nil || ssh != nil || dns != nil || openvpn != nil || wireguard != nil
